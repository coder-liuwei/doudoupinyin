[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pinyin-prince"
version = "0.1.0"
description = "为儿童语文学习生成 ruby 注音 HTML / PDF 打印稿"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "doudou" }]
dependencies = [
    "pypinyin>=0.50.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
pinyin-prince = "pinyin_prince.cli:main"

[tool.setuptools]
packages = ["pinyin_prince"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]
